services:
  iberdrola-monitor:
    build: .
    container_name: iberdrola-monitor
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEVICE_ID=${DEVICE_ID}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
      - CHARGER_IDS=${CHARGER_IDS}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
      - SCAN_JITTER_PCT=${SCAN_JITTER_PCT:-15}
      - SCAN_JITTER_MIN=${SCAN_JITTER_MIN:-5}
      - IBERDROLA_USER=${IBERDROLA_USER}
      - IBERDROLA_PASS=${IBERDROLA_PASS}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASS=${IMAP_PASS}
      - REDSYS_ANDROID_LICENSE=${REDSYS_ANDROID_LICENSE}
      - IBERDROLA_APP_VERSION=${IBERDROLA_APP_VERSION:-4.36.7}
      - PREFERRED_CONNECTOR_TYPE=${PREFERRED_CONNECTOR_TYPE:-}
      - HUNT_INTERVAL=${HUNT_INTERVAL:-60}
      - HUNT_MIN_INTERVAL=${HUNT_MIN_INTERVAL:-30}
      - HUNT_MAX_MINUTES=${HUNT_MAX_MINUTES:-180}
      - RESERVATION_MARKS_MIN=${RESERVATION_MARKS_MIN:-13,30}
      - API_TOKEN=${API_TOKEN:-}
      - API_PORT=${API_PORT:-8090}
      - TZ=Europe/Madrid
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
